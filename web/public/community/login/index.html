<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | MacWallpaperPro</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06040f">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script type="module" src="/assets/js/chrome.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</head>
<body class="page">
<a class="skip" href="#main">ข้ามไปเนื้อหา</a>
<header class="menubar" data-menubar></header>
<main id="main" class="auth-wrap">
  <div class="window glow">
    <div class="window-bar" aria-hidden="true"><span class="lights"><i></i><i></i><i></i></span><span class="window-title">บัญชี</span></div>
    <div class="window-body">
      <h1>เข้าสู่ระบบ</h1>
      <p class="muted">ใช้บัญชีเดียวกันทั้งบนเว็บและในแอป</p>
      <div data-msg></div>
      <form data-auth="login" novalidate>
        <div class="field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="switch">ยังไม่มีบัญชี <a href="/community/register" data-keep-next>สมัครสมาชิก</a></p>
    </div>
  </div>
</main>
</body>
</html>
