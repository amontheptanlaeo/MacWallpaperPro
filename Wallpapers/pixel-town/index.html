<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Town</title>
<!--
  Pixel Town — MacWallpaperPro community wallpaper.
  A low-res buffer (~250px tall) is drawn with integer coordinates only and
  blown up by an integer factor with smoothing off, so every pixel stays crisp.
  Each parallax layer is pre-rendered seamlessly (wrapping) in four lighting
  moods (day / dusk / night / dawn) and cross-faded along a slow day cycle.
  Windows and street lamps switch on one by one as night falls.
  Interaction: cursor -> parallax; click -> firework launched toward the cursor.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const P = { speed: 1 };
window.setP = o => { if (o && typeof o.speed === 'number' && isFinite(o.speed)) P.speed = Math.max(0, Math.min(4, o.speed)); };

function rnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = c => `rgb(${Math.max(0, Math.min(255, Math.round(c[0] * 255)))},${Math.max(0, Math.min(255, Math.round(c[1] * 255)))},${Math.max(0, Math.min(255, Math.round(c[2] * 255)))})`;

// ---------- moods ----------
const MOODS = [
  { // day
    m: [1, 1, 1], a: [0, 0, 0], haze: '#a8d8f4',
    sky: [[0, '#4a9ff0'], [0.6, '#8fd0fa'], [1, '#d4f2ff']],
  },
  { // dusk
    m: [0.92, 0.62, 0.70], a: [0.07, 0.01, 0.05], haze: '#e0849a',
    sky: [[0, '#28296a'], [0.42, '#7a4a98'], [0.72, '#e46f8a'], [1, '#ffb66a']],
  },
  { // night
    m: [0.24, 0.28, 0.52], a: [0.01, 0.015, 0.05], haze: '#1d2358',
    sky: [[0, '#060a24'], [0.6, '#141a4a'], [1, '#2b2f6e']],
  },
  { // dawn
    m: [0.86, 0.78, 0.92], a: [0.06, 0.03, 0.06], haze: '#f0b5c4',
    sky: [[0, '#3c5aa6'], [0.55, '#b08ac6'], [0.85, '#f5a7b6'], [1, '#ffe1a6']],
  },
];
// phase 0 = midnight, 0.5 = noon
const KEYS = [[0, 2], [0.2, 2], [0.26, 3], [0.33, 0], [0.67, 0], [0.735, 1], [0.79, 2], [1, 2]];
const MR = [2, 2, 0];
function moodAt(p) {
  MR[0] = 2; MR[1] = 2; MR[2] = 0;
  for (let i = 0; i < KEYS.length - 1; i++) if (p >= KEYS[i][0] && p <= KEYS[i + 1][0]) {
    const f = (p - KEYS[i][0]) / (KEYS[i + 1][0] - KEYS[i][0]);
    MR[0] = KEYS[i][1]; MR[1] = KEYS[i + 1][1]; MR[2] = f * f * (3 - 2 * f); break;
  }
  return MR;
}
function nightAt(p) { // 0 day .. 1 night
  const d = Math.abs(p - 0.5) * 2; // 0 noon, 1 midnight
  const x = (d - 0.42) / 0.22; return Math.max(0, Math.min(1, x));
}

// ---------- buffer ----------
let K = 4, BW = 400, BH = 250, LW = 1024;
const buf = document.createElement('canvas'); const b = buf.getContext('2d');
let layers = [], windows = [], lamps = [], skies = [], stars = [];

// layer definitions: depth haze amount, scroll speed (px/s), parallax factor
const LDEF = [
  { name: 'mount', haze: 0.4, speed: 0.35, par: 2 },
  { name: 'cloudF', haze: 0, speed: 1.6, par: 3, cloud: true },
  { name: 'hills', haze: 0.28, speed: 0.9, par: 4 },
  { name: 'town', haze: 0.18, speed: 2.0, par: 7 },
  { name: 'cloudN', haze: 0, speed: 3.6, par: 6, cloud: true, high: true },
  { name: 'near', haze: 0.05, speed: 3.6, par: 11 },
  { name: 'street', haze: 0, speed: 5.5, par: 16 },
];

function painter(g, mood, haze) {
  const H = hex(mood.haze);
  const cache = new Map();
  const col = h => {
    let v = cache.get(h); if (v) return v;
    const c = hex(h); let o = [c[0] * mood.m[0] + mood.a[0], c[1] * mood.m[1] + mood.a[1], c[2] * mood.m[2] + mood.a[2]];
    o = mix3(o, H, haze); v = css(o); cache.set(h, v); return v;
  };
  const R = (x, y, w, h, c) => { x = Math.round(x); y = Math.round(y); g.fillStyle = col(c); g.fillRect(x, y, w, h); if (x + w > LW) g.fillRect(x - LW, y, w, h); if (x < 0) g.fillRect(x + LW, y, w, h); };
  const D = (cx, cy, r, c) => { cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r); const r2 = (r + 0.5) * (r + 0.5); for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r2 - dy * dy)); R(cx - hw, cy + dy, hw * 2 + 1, 1, c); } };
  return { R, D, col };
}

function paintLayer(def, idx, g, mood, rec) {
  const { R, D } = painter(g, mood, def.haze);
  const r = rnd(1000 + idx * 77);
  const gy = BH - 24; // street top
  if (def.name === 'mount') {
    const base = Math.round(BH * 0.74);
    for (let pass = 0; pass < 2; pass++) {
      const ph = r() * 6.28, ph2 = r() * 6.28;
      for (let x = 0; x < LW; x++) {
        const u = x / LW * Math.PI * 2;
        const hgt = (pass ? 38 : 58) + Math.sin(u * 3 + ph) * 22 + Math.sin(u * 7 + ph2) * 10 + Math.sin(u * 13 + ph) * 4;
        const top = Math.round(base - hgt);
        R(x, top, 1, BH - top, pass ? '#6e7fc4' : '#8c96d6');
        if (!pass && hgt > 72) R(x, top, 1, Math.round((hgt - 72) * 0.6) + 1, '#eef4ff'); // snow caps
      }
    }
  } else if (def.cloud) {
    const n = Math.round(LW / (def.high ? 170 : 110));
    for (let i = 0; i < n; i++) {
      const cx = (i + r() * 0.6) * LW / n, cy = def.high ? 22 + r() * 34 : BH * 0.28 + r() * BH * 0.18;
      const s = def.high ? 1 + r() * 0.5 : 0.6 + r() * 0.5;
      const puffs = []; const np = 3 + (r() * 4 | 0);
      for (let j = 0; j < np; j++) puffs.push([cx + (j - np / 2) * 9 * s + r() * 4, cy - Math.sin(j / (np - 1) * Math.PI) * 6 * s, (5 + r() * 6) * s | 0]);
      R(cx - np * 5 * s - 4, cy + 1, np * 10 * s + 8, Math.round(3 * s) + 1, '#c7d4ee');
      for (const p of puffs) D(p[0], p[1] + 2, p[2], '#c7d4ee');
      for (const p of puffs) D(p[0], p[1], p[2], '#ffffff');
      for (const p of puffs) D(p[0] - 1, p[1] - Math.max(1, p[2] * 0.4 | 0), Math.max(1, p[2] * 0.5 | 0), '#ffffff');
    }
  } else if (def.name === 'hills') {
    const base = Math.round(BH * 0.8), ph = r() * 6.28;
    for (let x = 0; x < LW; x++) {
      const u = x / LW * Math.PI * 2;
      const top = Math.round(base - 18 - Math.sin(u * 4 + ph) * 9 - Math.sin(u * 9 + ph * 2) * 4);
      R(x, top, 1, BH - top, '#5aa56a'); R(x, top, 1, 1, '#7cc47d');
    }
    // tiny far houses
    let x = 10; while (x < LW - 6) {
      if (r() < 0.45) {
        const w = 5 + (r() * 4 | 0), h = 4 + (r() * 4 | 0), u = x / LW * Math.PI * 2;
        const top = Math.round(base - 18 - Math.sin(u * 4 + ph) * 9 - Math.sin(u * 9 + ph * 2) * 4);
        R(x, top - h + 2, w, h, '#e9e0d0'); R(x - 1, top - h + 1, w + 2, 1, '#b8574e');
        { const a = r(), bb = r(); if (rec) windows.push([idx, x + 1 + (a * (w - 2) | 0), top - h + 3, 1, 1, 0.15 + bb * 0.7]); }
        x += w + 2;
      } else if (r() < 0.5) { const u = x / LW * Math.PI * 2; const top = Math.round(base - 18 - Math.sin(u * 4 + ph) * 9 - Math.sin(u * 9 + ph * 2) * 4); D(x + 2, top - 2, 2, '#3f8a58'); x += 5; }
      else x += 4 + (r() * 10 | 0);
    }
  } else if (def.name === 'town' || def.name === 'near') {
    const near = def.name === 'near';
    const base = near ? gy : Math.round(BH * 0.86);
    const walls = near ? ['#f6e3c8', '#f2b8a0', '#bfe3d0', '#c9c3ef', '#f7d58a', '#a8d4f0'] : ['#e7dccb', '#d9c2b0', '#c2d6cc', '#c8c0dd', '#e8d4a4'];
    const roofs = ['#c8584e', '#9b4a5e', '#3f7f8f', '#d9774a', '#5c5a8a'];
    if (!near) { for (let x = 0; x < LW; x++) R(x, base, 1, BH - base, '#6b8f6a'); }
    let x = 0;
    while (x < LW) {
      if (near && r() < 0.3) { // tree
        const h = 10 + (r() * 8 | 0); R(x + 6, base - h, 2, h, '#7a4e3a');
        D(x + 7, base - h - 4, 7, '#3e8a52'); D(x + 5, base - h - 6, 4, '#58a865'); R(x + 3, base - h - 8, 2, 1, '#7cc47d');
        x += 16; continue;
      }
      const tall = !near && r() < 0.25;
      const w = near ? 26 + (r() * 16 | 0) : (tall ? 14 + (r() * 8 | 0) : 18 + (r() * 14 | 0));
      const h = near ? 22 + (r() * 16 | 0) : (tall ? 40 + (r() * 26 | 0) : 18 + (r() * 18 | 0));
      const top = base - h, wall = walls[(r() * walls.length) | 0], roof = roofs[(r() * roofs.length) | 0];
      R(x, top, w, h, wall);
      // shade side
      g.globalAlpha = 0.18; R(x + w - 3, top, 3, h, '#2a2050'); g.globalAlpha = 1;
      if (tall) {
        R(x - 1, top - 2, w + 2, 2, roof);
        if (r() < 0.5) { R(x + (w >> 1), top - 8, 1, 6, '#5c5a8a'); if (rec) windows.push([idx, x + (w >> 1), top - 9, 1, 1, -1]); } // antenna w/ red light
      } else {
        // gabled stepped roof
        const rh = Math.ceil((w + 2) / 2);
        for (let i = 0; i < rh; i++) R(x - 1 + i, top - i - 1, w + 2 - i * 2, 1, roof);
        g.globalAlpha = 0.25; for (let i = 0; i < rh; i++) R(x - 1 + i, top - i - 1, 1, 1, '#ffffff'); g.globalAlpha = 1;
        if (r() < 0.6) { const cx = x + 3 + (r() * (w - 8) | 0); R(cx, top - rh + 1, 3, Math.max(2, rh - 3), '#8a5a4a'); }
      }
      // windows
      const ww = near ? 3 : 2, wh = near ? 4 : 3, gx = near ? 7 : 5, gyy = near ? 8 : 6;
      for (let wy = top + 4; wy < base - (near ? 12 : 6); wy += gyy) for (let wx = x + 3; wx <= x + w - ww - 3; wx += gx) {
        R(wx, wy, ww, wh, '#4a5a8a');
        if (near) { R(wx - 1, wy + wh, ww + 2, 1, '#ffffff'); }
        { const a = r(); if (rec) windows.push([idx, wx, wy, ww, wh, a]); }
      }
      if (near) { // door + awning
        const dx = x + 4 + (r() * (w - 12) | 0);
        R(dx, base - 9, 5, 9, '#7a4e3a'); R(dx + 3, base - 5, 1, 1, '#f7d58a');
        if (r() < 0.5) { const aw = roofs[(r() * roofs.length) | 0]; for (let i = 0; i < 9; i++) R(dx - 2 + i, base - 11, 1, 2, i % 2 ? aw : '#ffffff'); }
        { const a = r(); if (rec) windows.push([idx, dx + 1, base - 8, 3, 3, 0.05 + a * 0.3]); }
        // flower box
        if (r() < 0.5) { R(x + 2, base - 14, 6, 2, '#7a4e3a'); R(x + 2, base - 15, 1, 1, '#ff6b8a'); R(x + 4, base - 15, 1, 1, '#ffd166'); R(x + 6, base - 15, 1, 1, '#ff6b8a'); }
      }
      x += w + (near ? 2 + (r() * 4 | 0) : 1 + (r() * 3 | 0));
      if (!near && r() < 0.25) { D(x + 3, base - 4, 4, '#3f8a58'); x += 8; }
    }
  } else if (def.name === 'street') {
    R(0, gy, LW, BH - gy, '#7d7a8c');
    R(0, gy, LW, 2, '#b9b4c6');
    for (let x = 0; x < LW; x += 8) R(x + ((x / 8) & 1) * 4, gy + 5, 4, 1, '#6b6878');
    for (let x = 0; x < LW; x += 8) R(x + 2 + ((x / 8) & 1) * 3, gy + 10, 4, 1, '#6b6878');
    R(0, gy + 14, LW, BH - gy - 14, '#5d5a6c');
    for (let x = 0; x < LW; x += 16) R(x, gy + 19, 8, 1, '#e8e0c0');
    // fence
    for (let x = 0; x < LW; x += 4) R(x, gy - 5, 1, 5, '#f2ece0');
    R(0, gy - 4, LW, 1, '#f2ece0');
    // bushes + flowers
    for (let x = 6; x < LW; x += 22 + (r() * 30 | 0)) { D(x, gy - 2, 4, '#3e8a52'); D(x - 1, gy - 3, 2, '#58a865'); if (r() < 0.6) { R(x + 1, gy - 4, 1, 1, '#ff8fb1'); R(x - 2, gy - 1, 1, 1, '#ffd166'); } }
    // lamp posts
    for (let x = 30; x < LW - 4; x += 74) {
      R(x, gy - 22, 1, 22, '#3a3550'); R(x - 1, gy - 2, 3, 2, '#3a3550');
      R(x - 2, gy - 25, 5, 3, '#3a3550'); R(x - 1, gy - 24, 3, 2, '#c9c2a0');
      { const a = r(); if (rec) lamps.push([x, gy - 23, a * 0.25]); }
    }
  }
}

function skyCanvas(mood) {
  const c = document.createElement('canvas'); c.width = 1; c.height = BH; const g = c.getContext('2d');
  // banded gradient (pixel-art style: discrete 4px bands)
  const stops = mood.sky.map(s => [s[0], hex(s[1])]);
  for (let y = 0; y < BH; y += 3) {
    const t = Math.min(1, y / (BH * 0.82));
    let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const f = (t - stops[i][0]) / (stops[i + 1][0] - stops[i][0]);
    g.fillStyle = css(mix3(stops[i][1], stops[i + 1][1], Math.max(0, Math.min(1, f)))); g.fillRect(0, y, 1, 3);
  }
  return c;
}

function build() {
  const dpr = Math.min(1.5, devicePixelRatio || 1);
  const dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  cv.width = dw; cv.height = dh;
  K = Math.max(2, Math.round(dh / 250));
  BW = Math.ceil(dw / K); BH = Math.ceil(dh / K);
  buf.width = BW; buf.height = BH;
  LW = Math.max(768, Math.ceil(BW * 2.2 / 64) * 64);
  windows = []; lamps = []; layers = [];
  LDEF.forEach((def, idx) => {
    const set = MOODS.map((mood, mi) => {
      const c = document.createElement('canvas'); c.width = LW; c.height = BH;
      paintLayer(def, idx, c.getContext('2d'), mood, mi === 0);
      return c;
    });
    layers.push(set);
  });
  skies = MOODS.map(skyCanvas);
  const r = rnd(5); stars = [];
  for (let i = 0; i < Math.round(BW * BH / 260); i++) stars.push([r() * BW | 0, r() * BH * 0.6 | 0, r() * 6.28, r() < 0.12 ? 2 : 1]);
  ctx.imageSmoothingEnabled = false;
}

// ---------- fireworks ----------
const NP = 900, px = new Float32Array(NP), py = new Float32Array(NP), pvx = new Float32Array(NP), pvy = new Float32Array(NP), pl = new Float32Array(NP), pc = new Uint8Array(NP);
let pHead = 0;
const FWC = ['#ff5d73', '#ffd166', '#7ae7ff', '#b892ff', '#7dffa1', '#ff9b54', '#ffffff'];
const rockets = []; // {x,y,tx,ty,c}
const fr = rnd(42);
function launch(tx, ty) {
  ty = Math.min(ty, BH - 60); ty = Math.max(ty, 18);
  rockets.push({ x: tx + (fr() - 0.5) * 30, y: BH - 26, tx, ty, c: (fr() * 6) | 0, vy: 0 });
  if (rockets.length > 8) rockets.shift();
}
function burst(x, y, c) {
  const n = 120 + (fr() * 50 | 0), c2 = (fr() * 7) | 0, ring = fr() < 0.35;
  booms.push([x, y, 1]); if (booms.length > 6) booms.shift();
  for (let i = 0; i < n; i++) {
    const a = fr() * 6.283, s = ring ? 58 + fr() * 5 : 10 + Math.sqrt(fr()) * 50;
    px[pHead] = x; py[pHead] = y; pvx[pHead] = Math.cos(a) * s; pvy[pHead] = Math.sin(a) * s;
    pl[pHead] = 1.2 + fr() * 0.9; pc[pHead] = i % 3 ? c : c2; pHead = (pHead + 1) % NP;
  }
  flash = 1;
}
let flash = 0; const booms = [];

// ---------- birds ----------
const birds = []; let birdT = 3;
function spawnBirds() {
  const dir = fr() < 0.5 ? 1 : -1, y = 30 + fr() * BH * 0.3, n = 3 + (fr() * 4 | 0), x0 = dir > 0 ? -20 : BW + 20;
  for (let i = 0; i < n; i++) birds.push({ x: x0 - dir * (i * 7 + fr() * 4), y: y + Math.abs(i - n / 2) * 4 + fr() * 2, v: dir * (14 + fr() * 3), ph: fr() * 6 });
}

// ---------- input ----------
const M = { nx: 0, sx: 0, last: -1e9 };
addEventListener('mousemove', e => { M.nx = e.clientX / innerWidth * 2 - 1; M.last = performance.now(); });
addEventListener('mousedown', e => { const dpr = cv.width / innerWidth; launch(Math.round(e.clientX * dpr / K), Math.round(e.clientY * dpr / K)); });

// ---------- loop ----------
const CYCLE = 240; // seconds per day at speed 1
let phase = 0.752, scroll = 0, last = performance.now(), t = 0, autoFW = 2;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  let dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = Math.max(last, now);
  dt *= P.speed * (RM.matches ? 0.25 : 1);
  t += dt; phase = (phase + dt / CYCLE) % 1; scroll += dt;
  const idle = performance.now() - M.last > 6000;
  const tnx = idle ? Math.sin(t * 0.05) * 0.4 : M.nx;
  M.sx += (tnx - M.sx) * Math.min(1, dt * 2);

  const mo = moodAt(phase), ma = mo[0], mb = mo[1], mf = mo[2], night = nightAt(phase);
  // sky
  b.globalAlpha = 1; b.drawImage(skies[ma], 0, 0, BW, BH);
  if (mf > 0) { b.globalAlpha = mf; b.drawImage(skies[mb], 0, 0, BW, BH); b.globalAlpha = 1; }
  if (flash > 0) { b.globalAlpha = flash * 0.12; b.fillStyle = '#ffe9c4'; b.fillRect(0, 0, BW, BH); b.globalAlpha = 1; flash = Math.max(0, flash - dt * 3); }
  // stars
  if (night > 0.05) {
    b.fillStyle = '#ffffff';
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i], tw = 0.5 + 0.5 * Math.sin(t * 1.5 + s[2] * 3);
      b.globalAlpha = night * (0.35 + tw * 0.65);
      b.fillRect(s[0], s[1], 1, 1);
      if (s[3] === 2 && tw > 0.7) { b.fillRect(s[0] - 1, s[1], 3, 1); b.fillRect(s[0], s[1] - 1, 1, 3); }
    }
    b.globalAlpha = 1;
  }
  // sun / moon
  const hz = BH * 0.72;
  const sp = (phase - 0.23) / 0.54; // sun visible 0..1
  if (sp > -0.05 && sp < 1.05) {
    const x = Math.round(BW * (0.06 + 0.88 * sp)), y = Math.round(hz - Math.sin(Math.PI * Math.max(0, Math.min(1, sp))) * BH * 0.5);
    const warm = 1 - Math.sin(Math.PI * Math.max(0, Math.min(1, sp)));
    b.globalAlpha = 0.25; disc(x, y, 16, warm > 0.5 ? '#ffb070' : '#fff6c8'); b.globalAlpha = 0.4; disc(x, y, 12, warm > 0.5 ? '#ffc58a' : '#fff6d8'); b.globalAlpha = 1;
    disc(x, y, 9, warm > 0.6 ? '#ffd07a' : '#fff4b8');
  }
  const mp = ((phase + 0.5) % 1 - 0.23) / 0.54;
  if (mp > -0.05 && mp < 1.05) {
    const x = Math.round(BW * (0.94 - 0.88 * mp)), y = Math.round(hz - Math.sin(Math.PI * Math.max(0, Math.min(1, mp))) * BH * 0.5);
    b.globalAlpha = 0.18; disc(x, y, 13, '#c8d4ff'); b.globalAlpha = 1;
    disc(x, y, 8, '#f3f0dc'); b.fillStyle = '#d4d0bc'; b.fillRect(x - 3, y - 2, 2, 2); b.fillRect(x + 2, y + 2, 3, 2); b.fillRect(x, y - 5, 2, 1);
  }
  // birds
  birdT -= dt; if (birdT < 0 && night < 0.6) { spawnBirds(); birdT = 14 + fr() * 14; }
  b.fillStyle = night > 0.5 ? '#141a40' : '#3a3550';
  for (let i = birds.length - 1; i >= 0; i--) {
    const q = birds[i]; q.x += q.v * dt; q.ph += dt * 9;
    const up = Math.sin(q.ph) > 0, x = Math.round(q.x), y = Math.round(q.y + Math.sin(q.ph * 0.3) * 1.5);
    b.fillRect(x, y, 1, 1);
    if (up) { b.fillRect(x - 2, y - 1, 2, 1); b.fillRect(x + 1, y - 1, 2, 1); } else { b.fillRect(x - 2, y + 1, 2, 1); b.fillRect(x + 1, y + 1, 2, 1); b.fillRect(x - 1, y, 1, 1); b.fillRect(x + 1, y, 1, 1); }
    if (q.x < -40 || q.x > BW + 40) birds.splice(i, 1);
  }
  // layers
  for (let li = 0; li < LDEF.length; li++) {
    const d = LDEF[li], set = layers[li];
    let off = scroll * d.speed + M.sx * d.par + 37 * li;
    off = Math.round(((off % LW) + LW) % LW);
    drawWrap(set[ma], off, 1);
    if (mf > 0) drawWrap(set[mb], off, mf);
    // windows of this layer
    if (night > 0.02) {
      for (let i = 0; i < windows.length; i++) {
        const w = windows[i]; if (w[0] !== li) continue;
        let x = w[1] - off; if (x < -4) x += LW; if (x > BW) continue;
        if (w[5] < 0) { if (Math.sin(t * 2.4 + w[1]) > 0.3) { b.fillStyle = '#ff4d5e'; b.globalAlpha = night; b.fillRect(x, w[2], 1, 1); b.globalAlpha = 1; } continue; }
        if (night < w[5] * 0.9 + 0.05) continue;
        const flick = (w[1] * 13 + w[2] * 7) % 17 === 0 && Math.sin(t * 0.7 + w[1]) > 0.6;
        b.fillStyle = flick ? '#8fd6ff' : ((w[1] + w[2]) % 5 === 0 ? '#ffe9a8' : '#ffc96a');
        b.fillRect(x, w[2], w[3], w[4]);
      }
    }
    if (d.name === 'street' && night > 0.05) {
      b.globalCompositeOperation = 'lighter';
      for (let i = 0; i < lamps.length; i++) {
        const L = lamps[i]; let x = L[0] - off; if (x < -20) x += LW; if (x > BW + 20) continue;
        const a = Math.max(0, Math.min(1, (night - L[2]) * 3)); if (a <= 0) continue;
        b.globalAlpha = a; b.drawImage(glow, x - 16, L[1] - 14);
        b.fillStyle = '#fff2b0'; b.fillRect(x - 1, L[1], 3, 2);

  if (!RM.matches) { autoFW -= dt; if (autoFW < 0) { if (night > 0.7) launch(Math.round(BW * (0.1 + fr() * 0.8)), Math.round(BH * (0.12 + fr() * 0.25))); autoFW = 5 + fr() * 9; } }
  b.globalCompositeOperation = 'lighter';
  for (let i = rockets.length - 1; i >= 0; i--) {
    const q = rockets[i]; q.y -= dt * 120; q.x += (q.tx - q.x) * Math.min(1, dt * 2.5);
    b.fillStyle = '#ffe9b0'; b.fillRect(Math.round(q.x), Math.round(q.y), 1, 2);
    b.fillStyle = '#ff9b54'; b.globalAlpha = 0.6; b.fillRect(Math.round(q.x), Math.round(q.y) + 2, 1, 3); b.globalAlpha = 1;
    if (q.y <= q.ty) { burst(q.x, q.y, q.c); rockets.splice(i, 1); }
  }
  for (let i = booms.length - 1; i >= 0; i--) {
    const q = booms[i]; q[2] -= dt * 2.2; if (q[2] <= 0) { booms.splice(i, 1); continue; }
    b.globalAlpha = q[2] * q[2]; b.drawImage(glow, Math.round(q[0] - 33), Math.round(q[1] - 30), 66, 60);
  }
  b.globalAlpha = 1;
  for (let i = 0; i < NP; i++) {
    if (pl[i] <= 0) continue;
    pl[i] -= dt; pvx[i] *= 1 - dt * 2.0; pvy[i] = pvy[i] * (1 - dt * 2.0) + 14 * dt;
    px[i] += pvx[i] * dt; py[i] += pvy[i] * dt;
    const l = pl[i]; if (l < 0.5 && ((i + (t * 20 | 0)) & 1)) continue; // sparkle out
    const al = Math.min(1, l * 1.4); b.fillStyle = FWC[pc[i]];
    b.globalAlpha = al * 0.45; b.fillRect(Math.round(px[i] - pvx[i] * 0.06), Math.round(py[i] - pvy[i] * 0.06), 1, 1);
    b.globalAlpha = al; const sz = l > 1.1 ? 2 : 1;
    b.fillRect(Math.round(px[i]) - (sz >> 1), Math.round(py[i]) - (sz >> 1), sz, sz);
  }
  b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BW * K, BH * K);
}
function drawWrap(img, off, a) {
  b.globalAlpha = a;
  b.drawImage(img, off, 0, Math.min(BW, LW - off), BH, 0, 0, Math.min(BW, LW - off), BH);
  if (LW - off < BW) b.drawImage(img, 0, 0, BW - (LW - off), BH, LW - off, 0, BW - (LW - off), BH);
  b.globalAlpha = 1;
}
function disc(cx, cy, r, c) { b.fillStyle = c; const r2 = (r + 0.5) * (r + 0.5); for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r2 - dy * dy)); b.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); } }
const glow = document.createElement('canvas'); glow.width = 33; glow.height = 30;
(() => { const g = glow.getContext('2d'); for (let r = 14; r > 0; r -= 3) { g.fillStyle = `rgba(255,200,110,${(0.08 + (14 - r) * 0.012).toFixed(3)})`; for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy)); g.fillRect(16 - hw, 14 + dy, hw * 2 + 1, 1); } } })();

let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
build();
requestAnimationFrame(frame);
})();
