<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Skyline</title>
<!--
  Cyber City — MacWallpaperPro community wallpaper.
  Four depth layers of procedurally built towers (pre-baked with fog), with
  live holographic billboards (abstract shapes only), blinking beacons,
  flying cars weaving between layers, two searchlights, smog and rain.
  Interaction: one searchlight tracks the cursor, layers shift with parallax;
  click -> a forked lightning strike lights up the sky.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a2a; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const P = { speed: 1 };
window.setP = o => { if (o && typeof o.speed === 'number' && isFinite(o.speed)) P.speed = Math.max(0, Math.min(4, o.speed)); };
function rnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rnd(77);

let W = 0, H = 0, DPR = 1, U = 1;
const MARGIN = 70;
const sky = document.createElement('canvas');
let layers = [];       // {c, par, beacons:[], boards:[], flick:[]}
const PAR = [6, 14, 26, 46];
const NEON = ['#ff2bd6', '#22e6ff', '#ffb347', '#a66bff', '#4dffb8'];

// ---------- sky ----------
function paintSky() {
  sky.width = cv.width; sky.height = cv.height;
  const g = sky.getContext('2d'); g.scale(DPR, DPR);
  const sg = g.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, '#0a0826'); sg.addColorStop(0.35, '#1d1250'); sg.addColorStop(0.62, '#4a1d72'); sg.addColorStop(0.8, '#a33a8c'); sg.addColorStop(1, '#ff7aa8');
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  // smog bands
  const r = rnd(3);
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y = H * (0.12 + r() * 0.5), rx = (200 + r() * 420) * U, ry = (16 + r() * 40) * U;
    const gr = g.createRadialGradient(x, y, 0, x, y, rx);
    const pink = r() < 0.5;
    gr.addColorStop(0, pink ? 'rgba(190,80,170,0.16)' : 'rgba(80,70,190,0.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.translate(x, y); g.scale(1, ry / rx); g.translate(-x, -y); g.fillStyle = gr; g.fillRect(x - rx, y - rx, rx * 2, rx * 2); g.restore();
  }
  // faint big moon behind smog
  const mx = W * 0.78, my = H * 0.2, mr = 70 * U;
  const mg = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3.2); mg.addColorStop(0, 'rgba(255,150,210,0.3)'); mg.addColorStop(1, 'rgba(255,170,220,0)');
  g.fillStyle = mg; g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  const md = g.createLinearGradient(0, my - mr, 0, my + mr); md.addColorStop(0, 'rgba(255,214,236,0.42)'); md.addColorStop(1, 'rgba(255,120,190,0.18)'); g.fillStyle = md; g.beginPath(); g.arc(mx, my, mr, 0, 6.283); g.fill();
  g.fillStyle = 'rgba(255,220,240,0.10)'; g.beginPath(); g.arc(mx - mr * 0.2, my - mr * 0.15, mr * 0.7, 0, 6.283); g.fill();
}

// ---------- buildings ----------
function valley(x) { const u = (x / W - 0.5) / 0.2; return 1 - 0.5 * Math.exp(-u * u); }
function paintLayer(li) {
  const lw = W + MARGIN * 2;
  const c = document.createElement('canvas'); c.width = Math.ceil(lw * DPR); c.height = cv.height;
  const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(MARGIN, 0);
  const r = rnd(100 + li * 13);
  const L = { c, par: PAR[li], beacons: [], boards: [], flick: [] };
  const cfg = [
    { wmin: 18, wmax: 46, tmin: 0.5, tmax: 0.68, body: '#2a1b5c', win: 0.22, ws: 2, ft: 'rgba(150,70,170,0.45)', fb: 'rgba(255,110,190,0.85)' },
    { wmin: 28, wmax: 70, tmin: 0.38, tmax: 0.62, body: '#1e1448', win: 0.25, ws: 2.5, ft: 'rgba(110,50,150,0.25)', fb: 'rgba(230,70,170,0.7)' },
    { wmin: 50, wmax: 120, tmin: 0.24, tmax: 0.56, body: '#140d34', win: 0.2, ws: 3, ft: 'rgba(70,30,110,0.12)', fb: 'rgba(190,40,150,0.55)' },
    { wmin: 0, wmax: 0, tmin: 0, tmax: 0, body: '#0b0722', win: 0.16, ws: 4, ft: 'rgba(40,15,70,0)', fb: 'rgba(140,30,120,0.45)' },
  ][li];
  const blds = [];
  if (li < 3) {
    let x = -MARGIN;
    while (x < W + MARGIN) {
      const w = (cfg.wmin + r() * (cfg.wmax - cfg.wmin)) * U;
      let top = H * (cfg.tmin + r() * (cfg.tmax - cfg.tmin));
      if (li > 0) top = H - (H - top) * valley(x + w / 2);
      blds.push([x, top, w]); x += w + r() * 6 * U;
    }
  } else {
    // massive framing towers + low blocks
    blds.push([-MARGIN, H * 0.1, W * 0.13 + MARGIN]); blds.push([W * 0.1, H * 0.36, W * 0.07]);
    blds.push([W * 0.86, H * 0.04, W * 0.14 + MARGIN]); blds.push([W * 0.8, H * 0.42, W * 0.07]);
    for (let x = W * 0.17; x < W * 0.8; x += (60 + r() * 60) * U) blds.push([x, H * (0.84 + r() * 0.08), (50 + r() * 70) * U]);
  }
  for (const [x, top, w] of blds) {
    // body with subtle vertical gradient
    const bg = g.createLinearGradient(0, top, 0, H);
    bg.addColorStop(0, shadeHex(cfg.body, 1.25)); bg.addColorStop(1, cfg.body);
    g.fillStyle = bg;
    // stepped / spired tops
    const kind = r();
    g.fillRect(x, top, w, H - top);
    if (kind < 0.25 && w > 30 * U) { g.fillRect(x + w * 0.2, top - w * 0.25, w * 0.6, w * 0.25); g.fillRect(x + w * 0.4, top - w * 0.5, w * 0.2, w * 0.25); }
    else if (kind < 0.4) { g.beginPath(); g.moveTo(x, top); g.lineTo(x + w / 2, top - w * 0.4); g.lineTo(x + w, top); g.fill(); }
    // antenna + beacon
    if (r() < 0.45) {
      const ax = x + w * (0.3 + r() * 0.4), ah = (10 + r() * 30) * U * (li + 1) * 0.6, at = top - (kind < 0.25 ? w * 0.5 : kind < 0.4 ? w * 0.4 : 0);
      g.fillStyle = cfg.body; g.fillRect(ax - 0.75, at - ah, 1.5, ah);
      L.beacons.push([ax, at - ah, r() * 6.28, r() < 0.7 ? 0 : 1]);
    }
    // windows: each building gets a coherent lighting style
    const ws = cfg.ws * U, gapx = ws * 2.2, gapy = ws * 2.6;
    const style = r(), palette = r() < 0.6 ? 0 : r() < 0.5 ? 1 : 2;
    const pick = q => palette === 0 ? (q < 0.82 ? 'rgba(255,212,150,0.9)' : 'rgba(140,230,255,0.9)') : palette === 1 ? (q < 0.75 ? 'rgba(120,225,255,0.9)' : 'rgba(255,120,220,0.85)') : (q < 0.7 ? 'rgba(255,125,210,0.85)' : 'rgba(255,212,150,0.9)');
    if (style < 0.22 && w > 30 * U) { // lit floor bands
      const step = ws * (3 + (r() * 3 | 0));
      for (let wy = top + ws * 3; wy < H - ws; wy += step) { if (r() < 0.45) continue; g.globalAlpha = 0.35 + r() * 0.5; g.fillStyle = pick(r()); g.fillRect(x + ws * 1.5, wy, w - ws * 3, ws * 0.7); }
      g.globalAlpha = 1;
    } else if (style < 0.34) { // vertical light columns
      for (let wx = x + ws * 2; wx < x + w - ws * 2; wx += ws * 4) { if (r() < 0.4) continue; g.globalAlpha = 0.3 + r() * 0.4; g.fillStyle = pick(r()); g.fillRect(wx, top + ws * 4, ws * 0.8, (H - top) * (0.3 + r() * 0.7)); }
      g.globalAlpha = 1;
    } else { // classic grid, lit in clusters of floors
      const dens = style > 0.85 ? 0.08 : cfg.win * (0.8 + r() * 1.6);
      let clusterOn = r() < 0.5, left = 0;
      for (let wy = top + ws * 3; wy < H - ws; wy += gapy) {
        if (left-- <= 0) { clusterOn = r() < 0.55; left = 2 + (r() * 8 | 0); }
        const p = clusterOn ? Math.min(0.9, dens * 2.6) : dens * 0.25;
        for (let wx = x + ws * 1.5; wx < x + w - ws * 1.5; wx += gapx) {
          if (r() > p) continue;
          g.fillStyle = pick(r());
          g.fillRect(wx, wy, ws, ws * 1.2);
          if (r() < 0.01) L.flick.push([wx, wy, ws, ws * 1.2]);
        }
      }
    }
    // rim light from the glowing city on one edge
    g.globalAlpha = 0.22; g.fillStyle = '#ff8fd8'; g.fillRect(x, top, Math.max(1, U), H - top); g.globalAlpha = 1;
    // neon edge strips
    if (r() < (li === 3 ? 0.9 : 0.35)) {
      const nc = NEON[(r() * NEON.length) | 0];
      g.save(); g.shadowColor = nc; g.shadowBlur = 8 * U; g.fillStyle = nc;
      const side = r() < 0.5 ? x + 1 : x + w - 2.5 * U;
      g.fillRect(side, top + 4, 1.5 * U, (H - top) * (0.3 + r() * 0.6));
      if (r() < 0.5) g.fillRect(x, top, w, 1.5 * U);
      g.restore();
    }
    // billboard slots on bigger buildings
    if (li >= 1 && w > 45 * U && r() < (li === 3 ? 1 : 0.35) && L.boards.length < (li === 3 ? 4 : 3)) {
      const bw = Math.min(w * 0.7, (li === 3 ? 120 : 60) * U), bh = bw * (r() < 0.5 ? 1.6 : 0.62);
      const by = top + (H - top) * (0.12 + r() * 0.3);
      if (by + bh < H * 0.95) L.boards.push([x + (w - bw) / 2, by, bw, bh, (r() * 5) | 0, NEON[(r() * 2) | 0], NEON[(r() * NEON.length) | 0], r() * 10]);
    }
  }
  // bake fog: heavier towards the bottom
  g.globalCompositeOperation = 'source-atop';
  const fg = g.createLinearGradient(0, H * (0.35 + li * 0.1), 0, H);
  fg.addColorStop(0, cfg.ft); fg.addColorStop(1, cfg.fb);
  g.fillStyle = fg; g.fillRect(-MARGIN, 0, lw, H);
  g.globalCompositeOperation = 'source-over';
  return L;
}
function shadeHex(h, k) { const c = [1, 3, 5].map(i => Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * k))); return `rgb(${c.join(',')})`; }

// ---------- dynamic ----------
const NR = 420, rain = new Float32Array(NR * 4);
function resetRain(i, any) { rain[i * 4] = R() * (W + 200) - 100; rain[i * 4 + 1] = any ? R() * H : -40 - R() * 200; rain[i * 4 + 2] = 0.4 + R() * 0.9; rain[i * 4 + 3] = R(); }
const cars = [];
function makeCars() {
  cars.length = 0;
  for (let i = 0; i < 16; i++) cars.push(newCar(true));
}
function newCar(any) {
  const depth = (R() * 3) | 0; // drawn after layer depth (0..2)
  const dir = R() < 0.5 ? 1 : -1, sp = (40 + R() * 70) * (depth + 1) * 0.6 * U;
  const lane = H * (0.22 + depth * 0.1 + R() * 0.22);
  return { x: any ? R() * W : (dir > 0 ? -60 : W + 60), y: lane, dir, sp, depth, bob: R() * 6.28, s: (0.6 + depth * 0.4) * U, col: R() < 0.5 ? '#22e6ff' : '#ff6ad5' };
}
let beam;
function makeBeam() {
  const L = Math.hypot(W, H) * 1.1, wdt = L * 0.16;
  beam = document.createElement('canvas'); beam.width = Math.ceil(L * 0.5); beam.height = Math.ceil(wdt * 0.5);
  const g = beam.getContext('2d'); g.scale(0.5, 0.5);
  const lg = g.createLinearGradient(0, 0, L, 0);
  lg.addColorStop(0, 'rgba(200,230,255,0.55)'); lg.addColorStop(0.25, 'rgba(160,200,255,0.2)'); lg.addColorStop(1, 'rgba(160,200,255,0)');
  g.fillStyle = lg; g.beginPath(); g.moveTo(0, wdt / 2 - 3); g.lineTo(L, 0); g.lineTo(L, wdt); g.lineTo(0, wdt / 2 + 3); g.closePath(); g.fill();
  // brighter core
  const cg = g.createLinearGradient(0, 0, L, 0); cg.addColorStop(0, 'rgba(255,255,255,0.5)'); cg.addColorStop(0.4, 'rgba(255,255,255,0)');
  g.fillStyle = cg; g.beginPath(); g.moveTo(0, wdt / 2 - 1.5); g.lineTo(L, wdt * 0.42); g.lineTo(L, wdt * 0.58); g.lineTo(0, wdt / 2 + 1.5); g.closePath(); g.fill();
  beam.L = L; beam.wd = wdt;
}
let vig, glowBot; const GLOW = {};
function makeGlows() { for (const c of NEON) { const q = document.createElement('canvas'); q.width = q.height = 128; const g = q.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, c); gr.addColorStop(0.35, c + '55'); gr.addColorStop(1, c + '00'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); GLOW[c] = q; } }
makeGlows();
function resize() {
  DPR = Math.min(1.5, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; U = Math.max(0.6, Math.min(W, H) / 900);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  paintSky(); layers = [0, 1, 2, 3].map(paintLayer);
  for (let i = 0; i < NR; i++) resetRain(i, true);
  makeCars(); makeBeam();
  vig = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.65);
  vig.addColorStop(0, 'rgba(5,2,20,0)'); vig.addColorStop(1, 'rgba(5,2,20,0.55)');
  glowBot = ctx.createLinearGradient(0, H * 0.7, 0, H);
  glowBot.addColorStop(0, 'rgba(255,60,170,0)'); glowBot.addColorStop(1, 'rgba(255,60,170,0.22)');
}

// lightning
const BOLT = new Float32Array(4 * 400); let boltN = 0, boltT = 0, flash = 0, nextAuto = 12;
function makeBolt(x0, yEnd, strong) {
  boltN = 0;
  const seg = (x1, y1, x2, y2, d, w) => {
    if (boltN >= 399) return;
    if (d <= 0) { BOLT[boltN * 4] = x1; BOLT[boltN * 4 + 1] = y1; BOLT[boltN * 4 + 2] = x2; BOLT[boltN * 4 + 3] = y2; boltN++; return; }
    const mx = (x1 + x2) / 2 + (R() - 0.5) * Math.abs(y2 - y1) * 0.45, my = (y1 + y2) / 2;
    seg(x1, y1, mx, my, d - 1, w); seg(mx, my, x2, y2, d - 1, w);
    if (d > 2 && R() < 0.35) seg(mx, my, mx + (R() - 0.5) * 220 * U, my + Math.abs(y2 - y1) * 0.35, d - 2, w * 0.5);
  };
  seg(x0, -10, x0 + (R() - 0.5) * 200 * U, yEnd, 7, 1);
  boltT = strong ? 0.55 : 0.3; flash = strong ? 1 : 0.4;
}

// input
const M = { x: W * 0.3, y: H * 0.3, nx: 0, ny: 0, last: -1e9 };
addEventListener('mousemove', e => { M.x = e.clientX; M.y = e.clientY; M.last = performance.now(); });
addEventListener('mousedown', e => { makeBolt(e.clientX + (R() - 0.5) * 120 * U, Math.min(e.clientY, H * 0.55) + H * 0.08, true); });

let last = performance.now(), t = 0, sx = 0, sy = 0, beamA = -1.9, beamB = -1.2;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  let dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = Math.max(last, now);
  dt *= P.speed * (RM.matches ? 0.25 : 1);
  t += dt;
  const idle = performance.now() - M.last > 5000;
  const tnx = idle ? Math.sin(t * 0.07) * 0.5 : M.x / W * 2 - 1;
  const tny = idle ? Math.sin(t * 0.05) * 0.2 : M.y / H * 2 - 1;
  sx += (tnx - sx) * Math.min(1, dt * 1.5); sy += (tny - sy) * Math.min(1, dt * 1.5);

  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.drawImage(sky, 0, 0);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  // lightning (behind towers)
  if (!RM.matches) { nextAuto -= dt; if (nextAuto < 0) { makeBolt(W * (0.05 + R() * 0.9), H * (0.3 + R() * 0.2), false); nextAuto = 14 + R() * 20; } }
  if (flash > 0) {
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = flash * (0.5 + 0.5 * Math.sin(t * 90)) * 0.55; g.fillStyle = '#b9a8ff'; g.fillRect(0, 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    flash = Math.max(0, flash - dt * 2.2);
  }
  if (boltT > 0) {
    boltT -= dt;
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      g.strokeStyle = pass ? 'rgba(255,255,255,0.95)' : 'rgba(170,150,255,0.35)'; g.lineWidth = (pass ? 2.2 : 9) * U;
      g.globalAlpha = Math.min(1, boltT * 4) * (Math.sin(t * 70) > -0.3 ? 1 : 0.3);
      g.beginPath();
      for (let i = 0; i < boltN; i++) { g.moveTo(BOLT[i * 4], BOLT[i * 4 + 1]); g.lineTo(BOLT[i * 4 + 2], BOLT[i * 4 + 3]); }
      g.stroke();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  for (let li = 0; li < 4; li++) {
    const L = layers[li], ox = -MARGIN + sx * -L.par * 1.2, oy = sy * -L.par * 0.25;
    g.drawImage(L.c, ox, oy, L.c.width / DPR, H);
    // beacons
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < L.beacons.length; i++) {
      const b = L.beacons[i], on = Math.sin(t * 2 + b[2]);
      if (on < 0.2) continue;
      const x = b[0] + MARGIN + ox, y = b[1] + oy, a = (on - 0.2) / 0.8;
      g.fillStyle = b[3] ? '#50e6ff' : '#ff3c50'; g.globalAlpha = a * 0.9;
      g.fillRect(x - 1.5, y - 1.5, 3, 3);
      g.globalAlpha = a * 0.3; g.beginPath(); g.arc(x, y, 6 * U, 0, 6.283); g.fill(); g.globalAlpha = 1;
    }
    // flickering windows (turn off briefly)
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = li === 3 ? '#0b0722' : '#1a1140';
    for (let i = 0; i < L.flick.length; i++) { const f = L.flick[i]; if (Math.sin(t * 1.3 + i * 7.1) > 0.7) g.fillRect(f[0] + MARGIN + ox, f[1] + oy, f[2], f[3]); }
    // billboards
    for (let i = 0; i < L.boards.length; i++) board(g, L.boards[i], ox + MARGIN, oy, li);
    // searchlights sit behind layer 2
    if (li === 1) searchlights(g, dt, idle);
    // flying cars after layers 0..2
    if (li < 3) drawCars(g, li, dt);
  }

  // rain
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'butt';
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass ? 'rgba(200,220,255,0.28)' : 'rgba(170,160,255,0.14)'; g.lineWidth = pass ? 1.1 : 0.8;
    g.beginPath();
    for (let i = pass; i < NR; i += 2) {
      const s = rain[i * 4 + 2];
      let x = rain[i * 4], y = rain[i * 4 + 1];
      y += dt * 900 * s * U; x -= dt * 160 * s * U;
      if (y > H + 20) { resetRain(i, false); continue; }
      rain[i * 4] = x; rain[i * 4 + 1] = y;
      g.moveTo(x, y); g.lineTo(x + 5 * s * U, y - 26 * s * U);
    }
    g.stroke();
  }
  g.fillStyle = glowBot; g.fillRect(0, H * 0.7, W, H * 0.3);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (flash > 0.02) { g.globalAlpha = flash * 0.12; g.fillStyle = '#e6e0ff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
}

function searchlights(g, dt, idle) {
  const ox1 = W * 0.27 - sx * 10, oy1 = H * 0.86, ox2 = W * 0.7 - sx * 10, oy2 = H * 0.88;
  let ta = idle ? -Math.PI / 2 + Math.sin(t * 0.23) * 0.55 : Math.atan2(M.y - oy1, M.x - ox1);
  ta = Math.max(-Math.PI + 0.25, Math.min(-0.25, ta));
  beamA += (ta - beamA) * Math.min(1, dt * 2.2);
  beamB = -Math.PI / 2 + Math.sin(t * 0.17 + 2) * 0.6;
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 2; k++) {
    const x = k ? ox2 : ox1, y = k ? oy2 : oy1, a = k ? beamB : beamA, al = k ? 0.38 : 0.6;
    g.save(); g.translate(x, y); g.rotate(a); g.globalAlpha = al;
    g.drawImage(beam, 0, -beam.wd / 2, beam.L, beam.wd);
    g.restore();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

function drawCars(g, li, dt) {
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i]; if (c.depth !== li) continue;
    c.x += c.dir * c.sp * dt; c.bob += dt;
    if (c.x < -120 || c.x > W + 120) { cars[i] = newCar(false); continue; }
    const x = c.x - sx * PAR[li] * 1.2, y = c.y + Math.sin(c.bob * 1.3) * 3 * U - sy * PAR[li] * 0.25, s = c.s;
    // trail
    g.strokeStyle = c.dir > 0 ? 'rgba(255,70,110,0.35)' : 'rgba(255,70,110,0.35)'; g.lineWidth = 1.5 * s;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - c.dir * 46 * s, y + 1); g.stroke();
    // body glow
    g.globalAlpha = 0.5; g.fillStyle = c.col; g.beginPath(); g.ellipse(x, y + 2 * s, 9 * s, 2.2 * s, 0, 0, 6.283); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#fff6e0'; g.beginPath(); g.arc(x + c.dir * 7 * s, y, 1.8 * s, 0, 6.283); g.fill();
    g.globalAlpha = 0.25; g.beginPath(); g.arc(x + c.dir * 7 * s, y, 7 * s, 0, 6.283); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#ff3b5c'; g.fillRect(x - c.dir * 8 * s - 1, y - 1, 2.5, 2);
  }
  g.globalCompositeOperation = 'source-over';
}

// holographic billboard: abstract animated shapes only
function board(g, b, ox, oy, li) {
  const [bx0, by0, bw, bh, kind, c1, c2, ph] = b;
  const x = bx0 + ox, y = by0 + oy, tt = t + ph;
  const fl = Math.sin(tt * 23) > 0.96 ? 0.4 : 1; // glitch flicker
  g.save();
  g.beginPath(); g.rect(x, y, bw, bh); g.clip();
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = 0.24 * fl; g.fillStyle = c1; g.fillRect(x, y, bw, bh);
  g.globalAlpha = 0.9 * fl; g.lineWidth = Math.max(1, bw / 50);
  const cx = x + bw / 2, cy = y + bh / 2, m = Math.min(bw, bh);
  if (kind === 0) { // rotating concentric arcs
    for (let i = 0; i < 4; i++) { g.strokeStyle = i % 2 ? c2 : c1; g.beginPath(); const r0 = m * (0.12 + i * 0.1); const a0 = tt * (0.6 + i * 0.35) * (i % 2 ? -1 : 1); g.arc(cx, cy, r0, a0, a0 + 4); g.stroke(); }
    g.fillStyle = c2; g.beginPath(); g.arc(cx, cy, m * 0.05 * (1 + 0.3 * Math.sin(tt * 4)), 0, 6.283); g.fill();
  } else if (kind === 1) { // equalizer bars
    const n = 9; g.fillStyle = c1;
    for (let i = 0; i < n; i++) { const h = bh * (0.15 + 0.6 * Math.abs(Math.sin(tt * (1.5 + i * 0.37) + i))); g.fillStyle = i % 3 ? c1 : c2; g.fillRect(x + bw * (0.08 + i * 0.094), y + bh * 0.9 - h, bw * 0.06, h); }
  } else if (kind === 2) { // waveforms
    for (let k = 0; k < 2; k++) { g.strokeStyle = k ? c2 : c1; g.beginPath(); for (let i = 0; i <= 24; i++) { const u = i / 24, yy = cy + Math.sin(u * 9 + tt * (2 + k) + k) * bh * 0.22 * Math.sin(u * Math.PI); i ? g.lineTo(x + u * bw, yy) : g.moveTo(x + u * bw, yy); } g.stroke(); }
  } else if (kind === 3) { // pulsing diamond / iris
    const s = m * (0.28 + 0.06 * Math.sin(tt * 2));
    g.strokeStyle = c1; g.beginPath(); g.moveTo(cx, cy - s); g.lineTo(cx + s, cy); g.lineTo(cx, cy + s); g.lineTo(cx - s, cy); g.closePath(); g.stroke();
    g.strokeStyle = c2; g.beginPath(); g.ellipse(cx, cy, s * 0.8, s * 0.35 * (0.6 + 0.4 * Math.abs(Math.sin(tt * 0.9))), 0, 0, 6.283); g.stroke();
    g.fillStyle = c2; g.beginPath(); g.arc(cx + Math.sin(tt * 0.7) * s * 0.3, cy, s * 0.15, 0, 6.283); g.fill();
  } else { // falling glyph-less blocks (abstract)
    g.fillStyle = c1;
    for (let i = 0; i < 6; i++) { const yy = y + ((tt * 0.25 + i * 0.17) % 1) * bh; g.fillRect(x + bw * (0.1 + (i * 0.37 % 0.8)), yy, bw * 0.12, bh * 0.05); }
    g.strokeStyle = c2; g.strokeRect(x + bw * 0.15, y + bh * 0.15, bw * 0.7, bh * 0.7);
  }
  // scanlines + frame
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.25; g.fillStyle = '#05020f';
  const sl = Math.max(2, bh / 40);
  for (let yy = y + ((tt * 20) % (sl * 2)); yy < y + bh; yy += sl * 2) g.fillRect(x, yy, bw, sl * 0.6);
  g.restore();
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.7 * fl; g.strokeStyle = c1; g.lineWidth = 1.2; g.strokeRect(x + 0.5, y + 0.5, bw - 1, bh - 1);
  // bloom
  g.globalAlpha = (0.22 + 0.05 * Math.sin(tt * 3)) * fl; g.drawImage(GLOW[c1], cx - bw * 1.1, cy - bh * 1.1, bw * 2.2, bh * 2.2);
  g.restore();
}

let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
resize();
requestAnimationFrame(frame);
})();
</script>
