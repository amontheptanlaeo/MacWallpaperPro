<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mountain Dawn</title>
<!--
  Mountain Dawn - MacWallpaperPro community wallpaper (nature)
  Single-pass WebGL: seven ridged mountain layers with atmospheric perspective,
  slope lighting, valley mist and high clouds. A slow day cycle drifts between
  blue hour, sunrise and soft morning (about 7 minutes per round trip).
  Cursor: depth parallax. Click: hurries the light forward a little.
  window.setP({c1: sun, c2: upper sky, c3: shadow tint, speed})
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3466 linear-gradient(#2a3a78,#f0a27a 55%,#3a3456 70%,#151630)}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const P = { c1:[1.0,0.66,0.36], c2:[0.20,0.30,0.62], c3:[0.16,0.13,0.30], speed:1 };
window.setP = o => { if(!o) return; for (const k of ['c1','c2','c3']) if (Array.isArray(o[k]) && o[k].length>=3) P[k]=o[k].slice(0,3); if (typeof o.speed==='number' && isFinite(o.speed)) P.speed=Math.max(0,Math.min(4,o.speed)); };
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'low-power' });
if (!gl) return;
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`precision highp float;
uniform vec2 R; uniform float T; uniform vec2 M; uniform float DAY;
uniform vec3 C1,C2,C3;
float hs(float n){return fract(sin(n)*43758.5453123);}
float h2(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n1(float x){float i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(hs(i),hs(i+1.),f);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*ns(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return v;}
float ridge(float x,float s){
  float v=0.,a=.55,f=1.;
  for(int i=0;i<6;i++){float n=n1(x*f+s*13.7+float(i)*3.1);n=1.-abs(n*2.-1.);v+=a*n*n;f*=2.07;a*=i<2?.5:.4;}
  return v;
}
void main(){
  vec2 fc=gl_FragCoord.xy; vec2 p=(fc-.5*R)/R.y; float AR=R.x/R.y;
  float day=DAY;                         // 0 blue hour .. .5 sunrise .. 1 morning
  float sunUp=smoothstep(.25,.95,day);
  vec2 sun=vec2(.28*AR*.6,mix(-.16,.26,smoothstep(.15,1.,day)));
  // ---- sky
  vec3 topN=C2*.32, topD=C2*.85+vec3(.04,.02,.06), topM=mix(C2,vec3(.30,.58,.95),.7);
  vec3 hzN=vec3(.42,.30,.52), hzD=mix(C1,vec3(1.,.45,.4),.25)*1.1, hzM=mix(C1,vec3(1.,.95,.86),.65);
  vec3 top=day<.5?mix(topN,topD,day*2.):mix(topD,topM,day*2.-1.);
  vec3 hz=day<.5?mix(hzN,hzD,day*2.):mix(hzD,hzM,day*2.-1.);
  float sy=smoothstep(-.15,.5,p.y);
  vec3 mid=mix(hz,vec3(.75,.38,.55)*(.5+.5*C2.b),.6);
  vec3 col=mix(mix(hz,mid,smoothstep(.0,.45,sy)),top,smoothstep(.3,1.,sy));
  float sd=length((p-sun)*vec2(.7,1.));
  float glowK=mix(.5,1.,sunUp);
  col+=C1*exp(-sd*2.8)*.5*glowK+mix(C1,vec3(1.),.6)*exp(-sd*10.)*.5*glowK;
  col=mix(col,mix(C1,vec3(1.,.97,.9),.6)*1.9,smoothstep(.04,.036,length(p-sun))*smoothstep(.0,.3,day));
  // stars fade out
  vec2 sg=floor(fc/R.y*220.); float st=h2(sg);
  col+=vec3(.85,.9,1.)*smoothstep(.996,1.,st)*smoothstep(.35,.0,day)*smoothstep(.0,.35,p.y)*(.6+.4*sin(T*2.+st*70.));
  // high clouds
  vec2 cq=vec2(p.x*1.4+T*.004+M.x*.01,p.y*5.);
  float cl=fbm(cq+vec2(fbm(cq*.6+T*.003)*1.2,0.));
  cl=smoothstep(.5,.85,cl)*smoothstep(.05,.3,p.y)*smoothstep(.62,.32,p.y);
  vec3 clc=mix(mix(vec3(.25,.22,.42),C1*vec3(1.,.6,.6),smoothstep(.15,.5,day)),vec3(1.,.96,.94),smoothstep(.6,1.,day));
  clc+=C1*exp(-sd*2.)*.4*sunUp;
  col=mix(col,clc,cl*.75);
  // ---- mountain layers
  float occ=0.;
  for(int i=0;i<7;i++){
    float fi=float(i); float d=fi/6.;
    float x=p.x+M.x*(.004+.05*d*d);
    float yy=p.y+M.y*.01*d;
    float base=mix(-.02,-.40,pow(d,.9));
    float amp=mix(.12,.20,d);
    float fr=mix(2.2,1.,d);
    float hx=ridge(x*fr,fi+1.);
    float h=base+amp*hx; float h0=h;
    if(i>=5){float k=mix(70.,45.,d-.8);float cx=floor(x*k);float tt=1.-abs(fract(x*k)-.5)*2.;float hh=hs(cx*7.3+fi);h+=pow(tt,1.6)*(.006+.022*hh*hh)*step(.25,hh)*(.6+.4*n1(x*3.+fi));}
    float px=1.5/R.y;
    float cov=smoothstep(h+px,h-px,yy);
    if(cov<.001) continue;
    float e=.025;
    float slope=(ridge((x+e)*fr,fi+1.)-ridge((x-e)*fr,fi+1.))*amp/(2.*e);
    float dep0=clamp((h0-yy)/.25,0.,1.);
    // light from the sun: faces whose slope tilts toward sun
    float face=clamp(-slope*sign(x-sun.x)*.6,-1.,1.);
    float depth=clamp((h0-yy)/.25,0.,1.);
    vec3 haze=mix(hz,top,.25)+C1*exp(-abs(x-sun.x)*1.6)*.22*sunUp*(1.-d*.5);
    vec3 shadow=mix(C3*mix(1.6,.55,d),vec3(.14,.22,.32)*mix(1.5,.55,d),smoothstep(.55,1.,day)*.8);
    vec3 lit=mix(C1*vec3(1.,.75,.62),vec3(1.,.9,.78),smoothstep(.5,1.,day));
    vec3 mc=shadow+lit*smoothstep(0.,.8,face)*mix(.22,.1,d)*sunUp*exp(-dep0*5.);
    mc+=lit*exp(-depth*60.)*mix(.22,.0,d)*sunUp*exp(-abs(x-sun.x)*2.5); // rim on crests near sun
    float aerial=mix(.78,.0,pow(d,.7));
    mc=mix(mc,haze,aerial);
    mc=mix(mc,haze,(1.-depth)*.0+depth*.12*(1.-d));
    col=mix(col,mc,cov); occ=max(occ,cov*(1.-d*.0));
    // valley mist above this layer
    float mb=exp(-pow((yy-h0+.03)/.07,2.))+exp(-pow((yy-base-.02)/.06,2.))*.6;
    float mist=fbm(vec2(x*2.2+T*.012*(1.+d)+fi*5.,yy*7.-T*.004));
    vec3 mcol=mix(haze,mix(C1,vec3(1.),.6),sunUp*.35*(1.-d));
    col=mix(col,mcol,smoothstep(.35,.8,mist)*mb*mix(.55,.35,d));
  }
  // crepuscular rays
  vec2 dv=p-sun; float ang=atan(dv.x,dv.y);
  float ray=n1(ang*5.+T*.02)*n1(ang*9.-T*.015)*1.25;
  col+=C1*pow(clamp(ray,0.,1.),2.)*exp(-length(dv)*1.6)*.14*smoothstep(.2,.55,day)*smoothstep(.95,.6,day)*(1.-occ*.85);
  vec2 uv=fc/R;
  col*=mix(.7,1.,smoothstep(1.3,.35,length((uv-.5)*vec2(1.1,1.))));
  col=1.-exp(-col*1.3);
  col=pow(col,vec3(1.05));
  col+=(h2(fc+fract(T))-.5)/255.;
  gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const aL=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(aL);gl.vertexAttribPointer(aL,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const uR=U('R'),uT=U('T'),uM=U('M'),uD=U('DAY'),uC1=U('C1'),uC2=U('C2'),uC3=U('C3');
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;const dpr=Math.min(devicePixelRatio||1,1.5);let w=W*dpr,h=H*dpr;const s=Math.min(1,Math.sqrt(2.4e6/(w*h)));cv.width=Math.max(1,w*s|0);cv.height=Math.max(1,h*s|0);gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();
const mouse={x:W/2,y:H/2,last:-1e9,px:0,py:0};let now=0;
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.last=now;});
let push=0;
addEventListener('mousedown',()=>{push+=12;mouse.last=now;});
// day phase: ping-pong, starts just before sunrise
const CYCLE=420; let ph=.282*CYCLE;
let T=0,last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden){last=t;return;}
  let rdt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;now=t/1000;
  const dt=rdt*P.speed*(RM.matches?.2:1);T+=dt;
  const pu=Math.min(push,rdt*6);push-=pu;ph+=dt+pu;
  const day=.5-.5*Math.cos(ph/CYCLE*2*Math.PI);
  const idle=now-mouse.last>4;
  const tx=idle?Math.sin(T*.05)*.5:(mouse.x/W*2-1),ty=idle?Math.sin(T*.035)*.3:(mouse.y/H*2-1);
  const k=Math.min(1,rdt*1.5);mouse.px+=(tx-mouse.px)*k;mouse.py+=(ty-mouse.py)*k;
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,T);gl.uniform2f(uM,mouse.px,-mouse.py);gl.uniform1f(uD,day);
  gl.uniform3fv(uC1,P.c1);gl.uniform3fv(uC2,P.c2);gl.uniform3fv(uC3,P.c3);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
